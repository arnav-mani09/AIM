# Game film used for training and evaluation. Team sorting reads valley_jersey to
# label each player Valley or Opponent; everyone not in Valley's colors is Opponent.
# split: train | eval | mixed (frames before eval_after_seconds train, the rest test).
games:
  - id: ontario-christian-high-school-game-angle-1
    file: backend/sample_data/@ Ontario Christian High School - Game - Angle 1.mp4
    minutes: 56.9
    gym: maroon-and-white walls, "COURT 7"
    valley_jersey: light blue
    opponent_jersey: white
    split: train
  - id: nolimit-var-vs-drive-angle-1
    file: backend/sample_data/NoLimit Var vs DRIVE - Angle 1.mp4
    minutes: 42.5
    gym: wood-slat walls, US flag, "WILDCATS" floor, scoreboard visible
    valley_jersey: white
    opponent_jersey: black
    # Through v3 the first half trained and the second half tested (split: mixed,
    # eval_after_seconds: 1275). From v4 the whole game trains; Menlo-Atherton is the test.
    split: train
  - id: valley-christian-vs-menlo-atherton-tactical
    file: backend/sample_data/Valley Christian vs Menlo-Atherton - Tactical.mp4
    minutes: 119.1
    game_window: [396, 5518]  # read off the scoreboard (clock 8:00 to 0.0); the rest is pregame and an empty court
    gym: Valley Christian home gym, center "VA" logo, navy paint, high center camera that pans, scoreboard overlay bottom left
    valley_jersey: white
    opponent_jersey: maroon
    # Unseen gym and camera: test only. Never train on it, so it stays a fair check.
    split: eval
  - id: valley-vs-archbishop-mitty
    file: backend/sample_data/Valley Christian vs Archbishop Mitty CCS - Tactical.mp4
    minutes: 105.1
    game_window: [235, 5000]  # seconds into the file: tip-off to final buzzer (read off the scoreboard)
    gym: Archbishop Mitty, "AM" center logo, black paint, high center camera that pans, scoreboard overlay bottom left
    valley_jersey: light blue
    opponent_jersey: white
    box_score: ml/data/stats/2026-27-hudl-box-scores.yaml  # Hudl, final 36-66
    split: eval
  - id: valley-vs-archbishop-riordan
    file: backend/sample_data/Valley Christian vs Archbishop Riordan - Tactical.mp4
    minutes: 99.3
    game_window: [615, 5600]
    gym: Archbishop Riordan, purple "R" center logo, purple paint, high center camera that pans, scoreboard overlay bottom left
    valley_jersey: light blue
    opponent_jersey: white
    box_score: ml/data/stats/2026-27-hudl-box-scores.yaml  # Hudl, final 41-61
    split: eval
